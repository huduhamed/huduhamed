<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820">
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#23262f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#17191b"/>

  <!-- Tagline -->
  <g class="sans" fill="#ffffff" font-size="80" font-weight="500">
    <text x="110" y="200">Thoughtful</text>
    <text x="110" y="292">interfaces.</text>
    <text x="110" y="384" fill="#5eead4">Solid</text>
    <text x="110" y="476" fill="#5eead4">engineering.</text>
  </g>

  <!-- Avatar + name -->
  <clipPath id="avatarClip"><circle cx="190" cy="640" r="72"/></clipPath>
  <circle cx="190" cy="640" r="77" fill="url(#avatar)"/>
  <image href="data:image/jpeg;base64," x="118" y="568" width="144" height="144" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  <text x="300" y="635" class="sans" font-size="46" fill="#c3c5dc">Hudu Hamed</text>
  <text x="300" y="682" class="sans" font-size="26" fill="#8b8fa8">Software Developer · hudufodio.com</text>

  <!-- Floating accents -->
  <g fill="#5eead4" opacity="0.85">
    <path d="M0 -14 Q10 0 0 14 Q-10 0 0 -14Z" transform="translate(905 200) rotate(35)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -12 Q9 0 0 12 Q-9 0 0 -12Z" transform="translate(1500 640) rotate(-60)"/>
    <path d="M0 -12 Q9 0 0 12 Q-9 0 0 -12Z" transform="translate(1040 740) rotate(20)"/>
  </g>
  <g fill="#3b82f6" opacity="0.85">
    <path d="M0 -16 Q11 0 0 16 Q-11 0 0 -16Z" transform="translate(1260 150) rotate(-30)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 8;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -13 Q9 0 0 13 Q-9 0 0 -13Z" transform="translate(870 450) rotate(70)"/>
    <path d="M0 -13 Q9 0 0 13 Q-9 0 0 -13Z" transform="translate(1360 760) rotate(-15)"/>
  </g>

  <!-- </> glyph -->
  <g transform="translate(1000 165) rotate(-12)">
    <text class="mono" font-size="64" font-weight="700" fill="#f59e0b">&lt;/&gt;</text>
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- Git branch graph -->
  <g transform="translate(1420 200)" stroke="#a78bfa" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M0 0 V150"/>
    <path d="M0 40 C0 75 60 70 60 105 V150"/>
    <circle cx="0" cy="0" r="12" fill="#17191b"/>
    <circle cx="0" cy="150" r="12" fill="#17191b"/>
    <circle cx="60" cy="105" r="12" fill="#a78bfa"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 10;0 0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Code editor window -->
  <g filter="url(#shadow)" transform="rotate(-5 1150 400)">
    <rect x="900" y="250" width="520" height="320" rx="18" fill="url(#win)" stroke="#3a3e4b" stroke-width="2"/>
    <circle cx="935" cy="282" r="8" fill="#f87171"/>
    <circle cx="962" cy="282" r="8" fill="#fbbf24"/>
    <circle cx="989" cy="282" r="8" fill="#34d399"/>
    <text x="1160" y="289" text-anchor="middle" class="mono" font-size="18" fill="#6b7085">hudu.ts</text>
    <line x1="900" y1="310" x2="1420" y2="310" stroke="#3a3e4b" stroke-width="2"/>
    <g class="mono" font-size="22">
      <text x="930" y="358"><tspan fill="#c084fc">const</tspan><tspan fill="#e5e7eb"> hudu = {</tspan></text>
      <text x="930" y="398"><tspan fill="#93c5fd">  based</tspan><tspan fill="#e5e7eb">: </tspan><tspan fill="#86efac">"Barcelona"</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="930" y="438"><tspan fill="#93c5fd">  stack</tspan><tspan fill="#e5e7eb">: [</tspan><tspan fill="#86efac">"TS"</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#86efac">"Node"</tspan><tspan fill="#e5e7eb">]</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="930" y="478"><tspan fill="#93c5fd">  learning</tspan><tspan fill="#e5e7eb">: </tspan><tspan fill="#fb923c">Infinity</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="930" y="518" fill="#e5e7eb">};</text>
    </g>
  </g>

  <!-- Terminal -->
  <g filter="url(#shadow)" transform="rotate(4 1050 620)">
    <rect x="870" y="550" width="360" height="150" rx="14" fill="#14161c" stroke="#2f3340" stroke-width="2"/>
    <g class="mono" font-size="24">
      <text x="898" y="600"><tspan fill="#5eead4">$</tspan><tspan fill="#e5e7eb"> npm test</tspan></text>
      <text x="898" y="640" fill="#34d399">✓ 128 passing</text>
      <text x="898" y="678" fill="#5eead4">$</text>
    </g>
    <rect x="922" y="660" width="14" height="24" fill="#e5e7eb">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Floating cube -->
  <g transform="translate(1330 620)">
    <path d="M0 -40 L40 -20 L0 0 L-40 -20Z" fill="#7dd3fc"/>
    <path d="M-40 -20 L0 0 L0 44 L-40 24Z" fill="#3b82f6"/>
    <path d="M40 -20 L0 0 L0 44 L40 24Z" fill="#1e40af"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -14;0 0" dur="6.5s" repeatCount="indefinite"/>
  </g>
</svg>
